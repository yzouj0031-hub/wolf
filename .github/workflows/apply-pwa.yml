name: Apply PWA support

on:
  push:
    branches:
      - agent/add-pwa-support
    paths:
      - scripts/apply-pwa.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-pwa-support
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update the application shell
        run: node scripts/apply-pwa.mjs
      - name: Commit generated page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add PWA metadata and service worker registration"
          git push
