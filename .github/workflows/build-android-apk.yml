name: Build Android APK

on:
  push:
    branches:
      - agent/build-android-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Capacitor dependencies
        run: npm ci
      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wolf-android-apk-selective-native-http-v1.2
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish test APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AI-Werewolf-Android-v1.2.apk
          gh release view android-v1.2 >/dev/null 2>&1 || gh release create android-v1.2 --prerelease --title "Android test v1.2 — CORS and cloud-save fix" --notes "AI API requests use native HTTP while Supabase registration, login, and cloud saves retain browser fetch compatibility. Requires internet access."
          gh release upload android-v1.2 AI-Werewolf-Android-v1.2.apk --clobber
