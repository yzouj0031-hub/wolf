name: Apply automatic saves

on:
  push:
    branches:
      - agent/add-autosave
    paths:
      - scripts/apply-autosave.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-autosave
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply automatic-save patch
        run: node scripts/apply-autosave.mjs
      - name: Validate inline JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(match => match[1]);
          scripts.forEach(script => new Function(script));
          NODE
      - name: Commit generated page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add automatic game saves"
          git push
