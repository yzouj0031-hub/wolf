name: Apply selective native HTTP

on:
  push:
    branches:
      - agent/selective-native-http
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/selective-native-http
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Link selective native HTTP bridge
        run: node scripts/apply-selective-native-http.mjs
      - name: Validate inline JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          for(const match of html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)) new vm.Script(match[1]);
          NODE
      - name: Commit generated page
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Route only AI requests through native HTTP"
          git push
