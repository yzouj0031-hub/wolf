name: Build Android APK

# 用 Capacitor 把 PWA 打成安卓 APK：生成应用图标/启动图 → 构建 → 签名 → 出包。
# - 推到 main：构建并发布到 GitHub Release（滚动标签 android-latest），永久可下载。
# - 推到 claude/android-apk：只出 workflow 产物，方便验证。
# - 配了发布签名密钥(secrets)就用正式签名，否则自动回退 debug 签名。
on:
  workflow_dispatch:
  push:
    branches: [main, claude/android-apk]
    paths:
      - 'index.html'
      - 'native-http.js'
      - 'hot-update.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'tablet.css'
      - 'icons/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 构建号要数全部提交，浅克隆会永远得到 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 构建号取值方式必须与 hot-update.yml 完全一致：同一个 commit 出的 APK 和热更新包
      # 构建号相同，刚装上最新 APK 的用户才不会被同构建号的热更新包重复覆盖。
      - name: Compute build number
        id: ver
        run: |
          BUILD="$(git rev-list --count HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=b$BUILD ($SHORT)" >> "$GITHUB_OUTPUT"
          echo "构建号 $BUILD / $SHORT"

      # 写进 hot-update.js(APP_BUILD) 和 sw.js(BUNDLED_BUILD)。
      # 不写的话 BUNDLED_BUILD 恒为 0，任何旧热更新包都会压过这个新安装包。
      - name: Stamp build number into web assets
        run: node scripts/stamp-build.mjs "${{ steps.ver.outputs.build }}" "${{ steps.ver.outputs.version }}"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Render app icon & splash from SVG
        run: node scripts/render-icon.mjs

      - name: Collect web assets into www/
        run: node scripts/build-www.mjs

      - name: Add Android platform
        run: npx cap add android

      # @capgo/capacitor-updater pulls AndroidX WorkManager 2.10.x, whose
      # AAR metadata requires consumers to compile against Android API 35+.
      # Capacitor 6 still generates compileSdkVersion 34 by default, so raise
      # only the compile SDK here; minSdk/targetSdk and device compatibility
      # remain unchanged.
      - name: Use Android compile SDK 35
        run: |
          sdkmanager "platforms;android-35"
          echo "ext.compileSdkVersion = 35" >> android/variables.gradle
          tail -n 5 android/variables.gradle

      - name: Generate launcher icons & splash
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build & sign APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔐 检测到发布签名密钥，使用正式签名"
            echo "$KEYSTORE_BASE64" | base64 -d > ../release.jks
            ./gradlew assembleRelease --no-daemon --stacktrace
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign \
              --ks ../release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
              --out ../ai-wolf.apk aligned.apk
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "🧪 未配置发布签名密钥，使用 debug 签名（个人侧载安装即可）"
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../ai-wolf.apk
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi
          cd ..
          ls -la ai-wolf.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-wolf-apk
          path: ai-wolf.apk
          if-no-files-found: error

      - name: Publish to GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: AI狼人杀 · 安卓版（最新）
          body: |
            自动构建的安卓 APK（${{ steps.build.outputs.signed }} 签名）· 构建号 `${{ steps.ver.outputs.version }}`。
            下载下方的 `ai-wolf.apk`，传到手机侧载安装即可。首次打开需联网、在设置里填模型 API key。

            装好之后网页部分会自动热更新（后台下载、下次启动生效），
            只有改动原生层时才需要回来重新下载安装包。
          files: ai-wolf.apk
          make_latest: true
