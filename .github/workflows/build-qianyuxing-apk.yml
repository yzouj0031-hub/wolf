name: Build 千屿行 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qianyuxing/**'
      - '.github/workflows/build-qianyuxing-apk.yml'

permissions:
  contents: write

defaults:
  run:
    working-directory: qianyuxing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build number
        id: ver
        run: |
          BUILD="$(git rev-list --count HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=b$BUILD ($SHORT)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Collect web assets into www/
        run: node scripts/build-www.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Stamp version
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${BUILD_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${BUILD_NUMBER}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Generate launcher icons & splash
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          set -o pipefail
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔐 使用正式签名"
            echo "$KEYSTORE_BASE64" | base64 -d > ../release.jks
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks ../release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out ../qianyuxing.apk aligned.apk
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "🧪 未配置签名密钥，使用 debug 签名（侧载安装即可）"
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
            cp app/build/outputs/apk/debug/app-debug.apk ../qianyuxing.apk
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi
          cd ..
          ls -la qianyuxing.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qianyuxing-apk
          path: qianyuxing/qianyuxing.apk
          if-no-files-found: error

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qianyuxing-gradle-log
          path: qianyuxing/gradle-build.log
          if-no-files-found: ignore

      - name: Publish to GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qianyuxing-android-latest
          name: 千屿行 · 安卓版（最新）
          body: |
            自动构建的安卓 APK（${{ steps.build.outputs.signed }} 签名）· 构建号 `${{ steps.ver.outputs.version }}`。
            下载 `qianyuxing.apk` 传到手机侧载安装。游戏完全离线可玩；联网时会加载更好看的字体。
          files: qianyuxing/qianyuxing.apk
          make_latest: false
