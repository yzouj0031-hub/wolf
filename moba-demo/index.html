<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>诸界争锋 3D · 原创3V3 MOBA</title>
<style>
:root{--blue:#49d8ff;--red:#ff5778;--gold:#ffd477}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070d;color:#f4f7ff;font-family:system-ui,"Microsoft YaHei",sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}#loading,#select,#end,#rotate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#24334f,#080b12 68%);padding:20px}#loading h1,#select h1{font-size:clamp(34px,7vw,72px);letter-spacing:.18em;margin:0;color:#ffe5a5;text-shadow:0 0 28px #d89d42}.bar{width:min(420px,75vw);height:9px;background:#0b101a;border:1px solid #5c6780;border-radius:8px;margin-top:22px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#40c9ff,#ffce77);transition:width .2s}#loadText{color:#9eadc5;margin-top:10px}.hidden{display:none!important}.subtitle{color:#9eacc5;margin:3px 0 18px}.cards{display:grid;grid-template-columns:repeat(3,minmax(160px,220px));gap:11px;max-height:70vh;overflow:auto}.card{position:relative;text-align:left;padding:14px;border:1px solid #63708d;border-radius:13px;color:#fff;background:linear-gradient(145deg,#182338,#0d1422);box-shadow:inset 0 0 25px #0a0f19}.card:active,.card:hover{border-color:var(--gold);transform:translateY(-2px)}.portrait{height:86px;border-radius:9px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:48px;background:radial-gradient(circle,#385274,#101726)}.card strong{font-size:20px;color:#ffe0a0}.card small{float:right;padding:2px 7px;border-radius:8px;background:#34425e}.card p{font-size:12px;color:#aab6ca;margin:5px 0}.card em{font-size:11px;color:#7ee2ff;font-style:normal}#hud{position:fixed;inset:0;z-index:10;pointer-events:none}.score{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:17px;align-items:center;padding:7px 16px;border:1px solid #7a89a566;background:#07101ddd;border-radius:12px;font-weight:900}.blue{color:var(--blue)}.red{color:var(--red)}#status{position:absolute;left:max(9px,env(safe-area-inset-left));top:max(52px,calc(env(safe-area-inset-top) + 48px));width:min(280px,35vw);background:#07101ddd;border:1px solid #52627e;border-radius:11px;padding:8px}.hero-name{font-weight:900;color:#ffe5a7}.health,.mana,.xp{height:8px;background:#250e18;border-radius:7px;overflow:hidden;margin-top:4px}.mana{height:5px;background:#111b35}.xp{height:3px;background:#2d2713}.health i,.mana i,.xp i{display:block;height:100%;transition:width .15s}.health i{background:linear-gradient(90deg,#18b967,#b3ef72)}.mana i{background:#489cff}.xp i{background:#ffd25d}#feed{position:absolute;right:10px;top:58px;text-align:right;width:min(330px,38vw);font-size:12px;text-shadow:0 1px 4px #000}.feed{margin:3px 0}.minimap{position:absolute;right:max(12px,env(safe-area-inset-right));top:105px;width:150px;height:76px;border:1px solid #62728d;border-radius:8px;background:#07101dcc}.joy{position:absolute;left:max(25px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;border:2px solid #b2dcff3b;background:#16335355;pointer-events:auto}.knob{position:absolute;left:44px;top:44px;width:42px;height:42px;border-radius:50%;background:#c1e5ff99;box-shadow:0 0 18px #38c6ff}.skills{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(2,66px);gap:8px;pointer-events:auto}.skill{position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #8191b4;background:radial-gradient(circle at 35% 25%,#536989,#142039 72%);font-weight:900;font-size:19px;color:white;text-shadow:0 2px 3px #000;box-shadow:0 3px 12px #0009}.skill b{position:absolute;bottom:2px;font-size:9px;max-width:58px;white-space:nowrap;overflow:hidden}.skill .cd{position:absolute;inset:0;border-radius:50%;background:#03070dcc;display:none;align-items:center;justify-content:center;font-size:20px}.skill.ult{border-color:#ffd25f;background:radial-gradient(circle,#956128,#371728)}.skill.attack{grid-row:1/3;grid-column:3;width:82px;height:82px;align-self:center;border-color:#ff8aa3;background:radial-gradient(circle,#c0526b,#371421)}#tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);color:#ffffff99;font-size:11px}.damage{position:fixed;z-index:12;font-weight:900;pointer-events:none;text-shadow:0 2px 3px #000;animation:float .75s forwards}@keyframes float{to{transform:translateY(-45px);opacity:0}}#end h2{font-size:clamp(45px,9vw,95px);margin:0}#end p{color:#b7c2d6}#end button{padding:13px 38px;border:1px solid var(--gold);border-radius:9px;background:#25314a;color:#fff;font-size:20px}#rotate{display:none;font-size:23px;text-align:center}#error{position:fixed;left:10px;right:10px;bottom:10px;z-index:100;padding:12px;background:#4a0810;color:white;border:1px solid #ff7890;display:none;white-space:pre-wrap}@media(max-height:650px){.cards{grid-template-columns:repeat(6,minmax(118px,1fr));max-width:1000px}.portrait{height:60px;font-size:34px}.card{padding:8px}.card p{display:none}.minimap{display:none}}@media(orientation:portrait) and (max-width:850px){#rotate{display:flex}.cards{grid-template-columns:repeat(2,minmax(130px,1fr))}}@media(max-width:720px){.skills{transform:scale(.86);transform-origin:right bottom}.joy{transform:scale(.86);transform-origin:left bottom}}
</style>
</head>
<body>
<div id="loading"><h1>诸界争锋</h1><div class="bar"><i id="progress"></i></div><div id="loadText">正在唤醒六位英雄…</div></div>
<section id="select" class="hidden"><h1>诸界争锋</h1><div class="subtitle">原创低模3D · 选择你的本命英雄</div><div class="cards" id="cards"></div><div id="tip">电脑：WASD移动，J普攻，K/L/U技能　·　手机/平板：左摇杆＋右侧按钮</div></section>
<div id="hud" class="hidden"><div class="score"><span class="blue">苍穹 <b id="bk">0</b></span><span id="time">00:00</span><span class="red"><b id="rk">0</b> 赤渊</span></div><div id="status"><div><span class="hero-name" id="heroName"></span><small id="level"></small></div><div class="health"><i id="hp"></i></div><div class="mana"><i id="mp"></i></div><div class="xp"><i id="xp"></i></div></div><div id="feed"></div><canvas class="minimap" id="map"></canvas><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="skills"><div class="skill" data-s="0">一<b id="sk0"></b><i class="cd"></i></div><div class="skill" data-s="1">二<b id="sk1"></b><i class="cd"></i></div><div class="skill ult" data-s="2">大<b id="sk2"></b><i class="cd"></i></div><div class="skill attack" data-s="a">⚔<b>普攻</b><i class="cd"></i></div></div></div>
<section id="end" class="hidden"><h2 id="result"></h2><p id="stats"></p><button onclick="location.reload()">再战一局</button></section>
<div id="rotate">请将设备横过来<br>进入诸界战场</div><div id="error"></div>
<script type="module" src="./game.js"></script>
</body></html>
