<title>诸界争锋 · 3V3 MOBA 原型</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#eef3ff;font-family:system-ui,"Microsoft YaHei",sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:7px 15px;border:1px solid #65749b66;border-radius:12px;background:#080d18d9;font-weight:800}.blue{color:#61d8ff}.red{color:#ff698b}#heroBar{position:absolute;left:10px;top:max(55px,calc(env(safe-area-inset-top) + 52px));width:min(250px,28vw);padding:8px;border-radius:10px;background:#07101ad0;border:1px solid #45536a}.name{font-weight:900}.hp{height:9px;background:#331525;border-radius:5px;overflow:hidden;margin-top:4px}.hp i{display:block;height:100%;background:linear-gradient(90deg,#24c77a,#b9f46c)}.mp{height:5px;background:#182744;border-radius:5px;overflow:hidden;margin-top:3px}.mp i{display:block;height:100%;background:#4da7ff}#feed{position:absolute;right:10px;top:58px;width:min(300px,36vw);font-size:12px;text-align:right;text-shadow:0 1px 3px #000}.msg{margin:2px 0}.joy{position:absolute;left:max(25px,env(safe-area-inset-left));bottom:max(28px,env(safe-area-inset-bottom));width:132px;height:132px;border:2px solid #8ccfff38;border-radius:50%;background:#12213a55;pointer-events:auto}.knob{position:absolute;left:43px;top:43px;width:44px;height:44px;border-radius:50%;background:#9fd7ff77;box-shadow:0 0 16px #4bc6ff}.skills{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px;pointer-events:auto}.skill{position:relative;border:2px solid #8295bf;border-radius:50%;background:radial-gradient(circle at 35% 30%,#50658b,#17223a 70%);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 3px #000}.skill b{position:absolute;bottom:2px;font-size:9px}.skill .cd{position:absolute;inset:0;border-radius:50%;display:none;align-items:center;justify-content:center;background:#05080cbb;font-size:20px}.skill.ult{border-color:#ffc651;background:radial-gradient(circle at 35% 30%,#9b6128,#3e1629 72%)}.skill.attack{grid-row:1/3;grid-column:3;width:78px;height:78px;align-self:center;border-color:#ff8aa2;background:radial-gradient(circle,#b34b61,#3b1627)}#select,#end{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 30%,#202c4b,#070910 70%);pointer-events:auto}h1{margin:0 0 6px;font-size:clamp(28px,6vw,58px);letter-spacing:.15em;color:#ffe5ac;text-shadow:0 0 20px #d79243}#select p{margin:4px 0 18px;color:#9aa8c3}.cards{display:grid;grid-template-columns:repeat(3,minmax(150px,220px));gap:10px;max-width:760px}.card{padding:14px;border:1px solid #66789a;border-radius:12px;background:#121a2c;color:#fff;text-align:left}.card:hover,.card:active{border-color:#ffd36d;background:#202943}.card strong{display:block;font-size:20px;color:#ffd98a}.card span{font-size:12px;color:#aebad0}.tag{float:right;padding:2px 7px;border-radius:8px;background:#354464}.hint{margin-top:15px;color:#77849d;font-size:12px}.hidden{display:none!important}#end h2{font-size:clamp(42px,9vw,90px);margin:0}#end button{pointer-events:auto;margin-top:25px;padding:13px 38px;border:1px solid #ffe199;border-radius:9px;background:#27324b;color:white;font-size:20px}.rotate{display:none}@media(orientation:portrait) and (max-width:800px){.rotate{display:flex;position:fixed;inset:0;z-index:99;background:#070910;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:22px}.cards{grid-template-columns:repeat(2,minmax(125px,1fr));overflow:auto}.card{padding:9px}.skills{transform:scale(.86);transform-origin:right bottom}.joy{transform:scale(.86);transform-origin:left bottom}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui" class="hidden">
 <div class="top"><span class="blue">苍穹 <b id="bk">0</b></span><span id="clock">00:00</span><span class="red"><b id="rk">0</b> 赤渊</span></div>
 <div id="heroBar"><div><span class="name" id="hn"></span><small id="lv"></small></div><div class="hp"><i id="hp"></i></div><div class="mp"><i id="mp"></i></div></div>
 <div id="feed"></div>
 <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
 <div class="skills">
  <div class="skill" data-s="0">一<b id="s0"></b><i class="cd"></i></div>
  <div class="skill" data-s="1">二<b id="s1"></b><i class="cd"></i></div>
  <div class="skill ult" data-s="2">大<b id="s2"></b><i class="cd"></i></div>
  <div class="skill attack" data-s="a">⚔<b>普攻</b><i class="cd"></i></div>
 </div>
</div>
<section id="select"><h1>诸界争锋</h1><p>原创暗黑神话 3V3 · 摧毁敌方赤晶核心</p><div class="cards" id="cards"></div><div class="hint">电脑：WASD移动，J普攻，K/L/U释放技能　·　手机/平板：左摇杆＋右侧技能</div></section>
<section id="end" class="hidden"><h2 id="result"></h2><div id="stats"></div><button onclick="location.reload()">再战一局</button></section>
<div class="rotate">请把设备横过来<br>进入诸界战场</div>
<script>
const C=document.querySelector('#game'),X=C.getContext('2d');let W,H,DPR=1,game=null,joy={x:0,y:0,id:null},keys={};
const defs=[
 {n:'雷咒师',role:'法师',c:'#8ed8ff',hp:720,atk:72,range:270,spd:175,skills:['雷链','霆狱','天罚'],desc:'连锁闪电、范围禁锢、全屏落雷'},
 {n:'玄甲卫',role:'坦克',c:'#e8c782',hp:1250,atk:48,range:78,spd:145,skills:['盾击','铁壁','山崩'],desc:'近身控制、护盾减伤、群体震飞'},
 {n:'夜行刃',role:'刺客',c:'#d18cff',hp:760,atk:92,range:72,spd:205,skills:['影突','烟隐','瞬狱'],desc:'高速突进、短暂隐身、斩杀残血'},
 {n:'星弦',role:'射手',c:'#86f0c4',hp:700,atk:78,range:300,spd:180,skills:['穿云','疾步','星落'],desc:'远程持续输出、加速、箭雨'},
 {n:'青灯使',role:'辅助',c:'#a9ff9a',hp:830,atk:54,range:230,spd:170,skills:['灵波','回春','彼岸灯'],desc:'弹射法术、群体治疗、团队护盾'},
 {n:'炎武尊',role:'战士',c:'#ff8b65',hp:980,atk:70,range:82,spd:165,skills:['烈拳','焚身','炎神降'],desc:'近战连击、吸血、狂暴变身'}
];
const cards=document.querySelector('#cards');defs.forEach((d,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML=`<span class="tag">${d.role}</span><strong>${d.n}</strong><span>${d.desc}</span>`;b.onclick=()=>start(i);cards.appendChild(b)});
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR;X.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),rand=(a,b)=>a+Math.random()*(b-a);
function unit(def,team,x,y,player=false){return{kind:'hero',def,team,x,y,spawnX:x,spawnY:y,player,hp:def.hp,maxHp:def.hp,mana:100,maxMana:100,atk:def.atk,range:def.range,spd:def.spd,dead:0,cd:[0,0,0,0],shield:0,buff:0,invis:0,k:0,d:0,level:1,xp:0,target:null}}
function structure(team,type,x,y){let core=type==='core';return{kind:type,team,x,y,hp:core?2600:1450,maxHp:core?2600:1450,range:core?330:300,atk:core?105:82,cd:0,r:core?45:30,dead:false}}
function start(pick){let order=[pick,...[0,1,2,3,4,5].filter(i=>i!==pick)],blue=order.slice(0,3),red=order.slice(3);game={t:0,last:performance.now(),heroes:[],minions:[],shots:[],zones:[],fx:[],structures:[],bk:0,rk:0,spawn:1,over:false,cam:{x:0,y:0}};blue.forEach((id,i)=>game.heroes.push(unit(defs[id],0,260,470+i*130,i===0)));red.forEach((id,i)=>game.heroes.push(unit(defs[id],1,2140,470+i*130)));game.structures=[structure(0,'core',100,600),structure(0,'tower',570,600),structure(1,'tower',1830,600),structure(1,'core',2300,600)];document.querySelector('#select').classList.add('hidden');document.querySelector('#ui').classList.remove('hidden');feed('战斗开始：摧毁敌方赤晶核心！','#ffd36d');requestAnimationFrame(loop)}
function minion(team,i){return{kind:'minion',team,x:team?2110:290,y:570+i*30,hp:210,maxHp:210,atk:22,range:i===2?150:45,spd:75,cd:0,dead:false}}
function spawnWave(){for(let t=0;t<2;t++)for(let i=0;i<3;i++)game.minions.push(minion(t,i))}
function foes(o){return[...game.heroes,...game.minions,...game.structures].filter(e=>e.team!==o.team&&!e.dead&&e.hp>0&&(e.kind!=='core'||!game.structures.some(s=>s.team===e.team&&s.kind==='tower'&&!s.dead)))}
function allies(o){return game.heroes.filter(e=>e.team===o.team&&!e.dead&&e.hp>0)}
function nearest(o,list=foes(o)){let best=null,bd=1e9;for(const e of list){let d=dist(o,e);if(d<bd){bd=d;best=e}}return[best,bd]}
function damage(src,t,n){if(!t||t.dead)return;n*=t.shield>0?.55:1;t.hp-=n;game.fx.push({x:t.x,y:t.y,text:'-'+Math.round(n),c:'#ff7590',life:.6});if(t.hp<=0)die(src,t)}
function heal(t,n){t.hp=Math.min(t.maxHp,t.hp+n);game.fx.push({x:t.x,y:t.y,text:'+'+Math.round(n),c:'#74ff9c',life:.6})}
function die(src,t){t.dead=true;t.hp=0;if(t.kind==='hero'){t.d++;t.dead=7;if(src?.kind==='hero'){src.k++;src.xp+=100;src.team?game.rk++:game.bk++;feed(`${src.def.n} 击败 ${t.def.n}`,src.team?'#ff8ba0':'#71dfff')}}else if(t.kind==='core'){end(src.team===0)}else if(t.kind==='tower')feed(`${t.team?'赤渊':'苍穹'}防御塔已破！`,'#ffd36d')}
function basic(h){if(h.cd[3]>0||h.dead)return;let[t,d]=nearest(h);if(t&&d<h.range+20){h.cd[3]=.65;game.shots.push({x:h.x,y:h.y,t,src:h,spd:650,dmg:h.atk,c:h.def.c})}}
function cast(h,s){if(h.dead||h.cd[s]>0||h.mana<20)return;let[t,d]=nearest(h);h.mana-=s===2?40:20;h.cd[s]=[5,9,18][s];let id=defs.indexOf(h.def),enemy=foes(h),friend=allies(h);
 if(id===0){if(s===0&&t)enemy.sort((a,b)=>dist(t,a)-dist(t,b)).slice(0,3).forEach((e,i)=>damage(h,e,110-i*20));if(s===1&&t){game.zones.push({x:t.x,y:t.y,r:115,life:2,team:h.team,dmg:35,slow:true,c:'#5bbcff'})}if(s===2)enemy.filter(e=>e.kind==='hero').forEach(e=>damage(h,e,180));}
 if(id===1){if(s===0&&t&&d<150)damage(h,t,150);if(s===1){h.shield=4;h.hp=Math.min(h.maxHp,h.hp+180)}if(s===2){enemy.filter(e=>dist(h,e)<210).forEach(e=>damage(h,e,180));game.zones.push({x:h.x,y:h.y,r:210,life:.7,team:h.team,c:'#e7c77d'})}}
 if(id===2){if(s===0&&t){let q=Math.min(220,d-35);h.x+=(t.x-h.x)/d*q;h.y+=(t.y-h.y)/d*q;damage(h,t,135)}if(s===1){h.invis=3;h.buff=3}if(s===2&&t){damage(h,t,t.hp/t.maxHp<.38?360:210)}}
 if(id===3){if(s===0&&t)game.shots.push({x:h.x,y:h.y,t,src:h,spd:850,dmg:175,c:'#a5ffe0'});if(s===1)h.buff=5;if(s===2&&t)game.zones.push({x:t.x,y:t.y,r:150,life:4,team:h.team,dmg:42,c:'#7df2c0'})}
 if(id===4){if(s===0&&t){damage(h,t,95);let t2=nearest(t,enemy.filter(e=>e!==t))[0];if(t2)damage(h,t2,70)}if(s===1)friend.forEach(a=>{if(dist(h,a)<300)heal(a,160)});if(s===2)friend.forEach(a=>{a.shield=6;heal(a,100)})}
 if(id===5){if(s===0&&t&&d<145){damage(h,t,155);heal(h,55)}if(s===1){h.buff=6;h.shield=3}if(s===2){h.buff=9;h.atk+=28;setTimeout(()=>h.atk-=28,9000)}}
}
function ai(h,dt){let[t,d]=nearest(h),low=h.hp/h.maxHp<.28;if(low){let dx=h.spawnX-h.x,dy=h.spawnY-h.y,l=Math.hypot(dx,dy)||1;h.x+=dx/l*h.spd*dt;h.y+=dy/l*h.spd*dt;if(d<180)cast(h,1);return}if(t){if(d>h.range*.82){let dx=t.x-h.x,dy=t.y-h.y,l=d||1;h.x+=dx/l*h.spd*dt*.72;h.y+=dy/l*h.spd*dt*.72}else basic(h);if(d<h.range*1.3&&Math.random()<dt*.5)cast(h,Math.random()<.14?2:Math.random()<.5?0:1)}}
function movePlayer(h,dt){let x=(keys.d?1:0)-(keys.a?1:0)+joy.x,y=(keys.s?1:0)-(keys.w?1:0)+joy.y,l=Math.hypot(x,y);if(l>.1){x/=l;y/=l;let sp=h.spd*(h.buff>0?1.35:1);h.x+=x*sp*dt;h.y+=y*sp*dt}h.x=clamp(h.x,35,2365);h.y=clamp(h.y,170,1030)}
function update(dt){game.t+=dt;game.spawn-=dt;if(game.spawn<=0){spawnWave();game.spawn=12}let p=game.heroes.find(h=>h.player);for(const h of game.heroes){for(let i=0;i<4;i++)h.cd[i]=Math.max(0,h.cd[i]-dt);h.shield=Math.max(0,h.shield-dt);h.buff=Math.max(0,h.buff-dt);h.invis=Math.max(0,h.invis-dt);h.mana=Math.min(100,h.mana+7*dt);if(h.dead){h.dead-=dt;if(h.dead<=0){h.dead=false;h.hp=h.maxHp;h.mana=100;h.x=h.spawnX;h.y=h.spawnY}continue}h.player?movePlayer(h,dt):ai(h,dt)}
 for(const m of game.minions){if(m.dead)continue;m.cd-=dt;let[t,d]=nearest(m);if(t&&d<m.range){if(m.cd<=0){m.cd=1.1;damage(m,t,m.atk)}}else m.x+=(m.team?-1:1)*m.spd*dt}
 for(const s of game.structures){if(s.dead)continue;s.cd-=dt;let[t,d]=nearest(s,foes(s).filter(e=>e.kind!=='tower'&&e.kind!=='core'));if(t&&d<s.range&&s.cd<=0){s.cd=1;damage(s,t,s.atk)}}
 for(const q of game.shots){if(q.t.dead){q.dead=true;continue}let dx=q.t.x-q.x,dy=q.t.y-q.y,l=Math.hypot(dx,dy);if(l<15){damage(q.src,q.t,q.dmg);q.dead=true}else{q.x+=dx/l*q.spd*dt;q.y+=dy/l*q.spd*dt}}game.shots=game.shots.filter(q=>!q.dead);
 for(const z of game.zones){z.life-=dt;if(z.dmg){for(const e of [...game.heroes,...game.minions])if(e.team!==z.team&&!e.dead&&dist(z,e)<z.r){e._zt=(e._zt||0)-dt;if(e._zt<=0){damage(null,e,z.dmg);e._zt=.45}}}}game.zones=game.zones.filter(z=>z.life>0);game.minions=game.minions.filter(m=>!m.dead&&m.x>0&&m.x<2400);game.fx.forEach(f=>f.life-=dt);game.fx=game.fx.filter(f=>f.life>0);game.cam.x=clamp(p.x-W/2,0,2400-W);game.cam.y=clamp(p.y-H/2,0,1200-H);hud(p)}
function hud(p){document.querySelector('#hn').textContent=p.def.n+' · '+p.def.role;document.querySelector('#lv').textContent='  Lv.'+p.level;document.querySelector('#hp').style.width=100*p.hp/p.maxHp+'%';document.querySelector('#mp').style.width=p.mana+'%';document.querySelector('#bk').textContent=game.bk;document.querySelector('#rk').textContent=game.rk;let sec=Math.floor(game.t),mm=String(sec/60|0).padStart(2,'0'),ss=String(sec%60).padStart(2,'0');document.querySelector('#clock').textContent=mm+':'+ss;p.def.skills.forEach((n,i)=>document.querySelector('#s'+i).textContent=n);document.querySelectorAll('.skill').forEach(el=>{let s=el.dataset.s,cd=s==='a'?p.cd[3]:p.cd[+s],o=el.querySelector('.cd');o.style.display=cd>0?'flex':'none';o.textContent=cd>0?cd.toFixed(cd<3?1:0):''})}
function draw(){X.clearRect(0,0,W,H);let ox=-game.cam.x,oy=-game.cam.y;X.save();X.translate(ox,oy);let g=X.createLinearGradient(0,0,2400,0);g.addColorStop(0,'#102c3d');g.addColorStop(.5,'#171423');g.addColorStop(1,'#3a1523');X.fillStyle=g;X.fillRect(0,0,2400,1200);X.strokeStyle='#7ca6a51d';X.lineWidth=2;for(let x=0;x<2400;x+=80){X.beginPath();X.moveTo(x,0);X.lineTo(x,1200);X.stroke()}X.fillStyle='#9ec8d018';X.fillRect(0,480,2400,240);X.strokeStyle='#e7d19b42';X.setLineDash([18,20]);X.beginPath();X.moveTo(0,600);X.lineTo(2400,600);X.stroke();X.setLineDash([]);
 for(const z of game.zones){X.globalAlpha=.22;X.fillStyle=z.c;X.beginPath();X.arc(z.x,z.y,z.r,0,7);X.fill();X.globalAlpha=1}for(const s of game.structures)drawUnit(s);for(const m of game.minions)drawUnit(m);for(const h of game.heroes)if(!h.dead)drawUnit(h);for(const q of game.shots){X.fillStyle=q.c;X.beginPath();X.arc(q.x,q.y,5,0,7);X.fill()}for(const f of game.fx){X.globalAlpha=f.life/.6;X.fillStyle=f.c;X.font='bold 16px sans-serif';X.fillText(f.text,f.x-12,f.y-28-f.life*20)}X.globalAlpha=1;X.restore();}
function drawUnit(e){let color=e.team?'#ff5577':'#42c8ff';if(e.kind==='hero'){X.globalAlpha=e.invis>0?.32:1;X.fillStyle=e.def.c;X.beginPath();X.arc(e.x,e.y,18,0,7);X.fill();X.strokeStyle=color;X.lineWidth=e.player?5:2;X.stroke();X.fillStyle='#fff';X.font='bold 12px sans-serif';X.textAlign='center';X.fillText(e.def.n,e.x,e.y-28)}else if(e.kind==='minion'){X.fillStyle=color;X.fillRect(e.x-8,e.y-8,16,16)}else{X.fillStyle=e.dead?'#272727':color;X.beginPath();e.kind==='core'?X.arc(e.x,e.y,e.r,0,7):X.rect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);X.fill();X.fillStyle='#fff';X.font='12px sans-serif';X.textAlign='center';X.fillText(e.kind==='core'?'核心':'塔',e.x,e.y+4)}if(!e.dead){X.fillStyle='#210b12';X.fillRect(e.x-22,e.y+(e.kind==='hero'?23:15),44,5);X.fillStyle=e.team?'#ff607a':'#54d6ff';X.fillRect(e.x-22,e.y+(e.kind==='hero'?23:15),44*Math.max(0,e.hp/e.maxHp),5)}X.globalAlpha=1}
function loop(now){if(!game||game.over)return;let dt=Math.min(.05,(now-game.last)/1000);game.last=now;update(dt);draw();requestAnimationFrame(loop)}
function feed(t,c='#fff'){let f=document.querySelector('#feed'),d=document.createElement('div');d.className='msg';d.style.color=c;d.textContent=t;f.prepend(d);setTimeout(()=>d.remove(),5000)}function end(blueWin){game.over=true;document.querySelector('#ui').classList.add('hidden');document.querySelector('#end').classList.remove('hidden');document.querySelector('#result').textContent=blueWin?'赤晶破碎 · 苍穹胜利':'苍穹陷落 · 赤渊胜利';document.querySelector('#result').style.color=blueWin?'#67dcff':'#ff6686';let p=game.heroes.find(h=>h.player);document.querySelector('#stats').textContent=`${p.def.n}　击败 ${p.k}　阵亡 ${p.d}　用时 ${Math.floor(game.t/60)}:${String(Math.floor(game.t)%60).padStart(2,'0')}`}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='j')basic(game?.heroes.find(h=>h.player));if(e.key.toLowerCase()==='k')cast(game?.heroes.find(h=>h.player),0);if(e.key.toLowerCase()==='l')cast(game?.heroes.find(h=>h.player),1);if(e.key.toLowerCase()==='u')cast(game?.heroes.find(h=>h.player),2)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const j=document.querySelector('#joy'),kn=document.querySelector('#knob');function jt(e){let t=[...e.changedTouches].find(q=>joy.id===null||q.identifier===joy.id);if(!t)return;if(joy.id===null)joy.id=t.identifier;let r=j.getBoundingClientRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=r.width*.36;if(l>m){dx*=m/l;dy*=m/l}joy.x=dx/m;joy.y=dy/m;kn.style.transform=`translate(${dx}px,${dy}px)`}j.addEventListener('touchstart',e=>{e.preventDefault();jt(e)},{passive:false});j.addEventListener('touchmove',e=>{e.preventDefault();jt(e)},{passive:false});j.addEventListener('touchend',e=>{if([...e.changedTouches].some(t=>t.identifier===joy.id)){joy={x:0,y:0,id:null};kn.style.transform=''}},{passive:false});document.querySelectorAll('.skill').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();let h=game?.heroes.find(q=>q.player),s=b.dataset.s;s==='a'?basic(h):cast(h,+s)}));
</script>
</body></html>
